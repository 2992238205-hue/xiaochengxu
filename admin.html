<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小说后台上传</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; margin: 0; background: #f4f7fb; color: #172234; }
    .wrap { width: min(980px, 96%); margin: 20px auto 50px; }
    .card { background: #fff; border: 1px solid #d9e2f0; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    h1 { margin: 0 0 14px; font-size: 1.25rem; }
    h2 { margin: 0 0 10px; font-size: 1.05rem; }
    label { display: block; margin-bottom: 10px; font-size: .9rem; color: #334562; }
    input, textarea, button, select { font: inherit; }
    input[type="text"], input[type="password"], textarea { width: 100%; border: 1px solid #cad6ea; border-radius: 10px; padding: 9px 10px; box-sizing: border-box; background: #fff; }
    textarea { min-height: 150px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { border: 1px solid #2557cf; background: linear-gradient(135deg,#2055d6,#153f9d); color: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 600; }
    .hint { color: #5d6c84; font-size: .85rem; line-height: 1.5; }
    .log { white-space: pre-wrap; background: #0e1726; color: #d0f2ff; border-radius: 10px; padding: 10px; min-height: 80px; font-size: .84rem; }
    .book-item { border: 1px solid #d8e3f4; border-radius: 10px; padding: 10px; margin-bottom: 8px; background: #fbfdff; }
    .book-item strong { display: inline-block; margin-bottom: 4px; }
    .book-toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .book-toolbar button { padding: 6px 10px; border-radius: 8px; border: 1px solid #c7d5ee; background: #fff; color: #2b3e61; }
    .book-row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: start; margin-top: 8px; }
    .book-cover { width: 120px; height: 160px; border-radius: 8px; border: 1px solid #d8e3f4; object-fit: cover; background: #edf2fb; }
    .book-meta { display: grid; gap: 8px; }
    .book-meta input { width: 100%; }
    .danger { border-color: #e77888 !important; color: #b42336 !important; }
    .book-batch-toolbar { display: grid; grid-template-columns: 1.4fr auto auto auto auto; gap: 8px; align-items: center; margin: 10px 0 12px; }
    .book-batch-toolbar input[type="password"] { width: 100%; border: 1px solid #cad6ea; border-radius: 8px; padding: 8px 9px; }
    .book-batch-toolbar button { padding: 8px 10px; border-radius: 8px; border: 1px solid #c7d5ee; background: #fff; color: #2b3e61; }
    .pick-book { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 0.85rem; color: #425675; }
    @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
    @media (max-width: 760px) { .book-batch-toolbar { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>后台上传（管理员）</h1>
      <p class="hint">上传后，所有读者书架自动出现这本书。读者端不可上传。</p>
    </div>

    <div class="card">
      <h2>上传书籍</h2>
      <form id="upload-form">
        <label>管理员密钥
          <input id="admin-key" type="password" placeholder="部署时设置的 ADMIN_KEY" required>
        </label>
        <p id="key-status" class="hint"></p>
        <label>书籍文件（.md / .json）
          <input id="book-file" type="file" accept=".md,.markdown,.json,text/markdown,application/json" required>
        </label>
        <div class="row">
          <label>覆盖书籍 ID（可选）
            <input id="book-id" type="text" placeholder="例如 deep-awakening-v1">
          </label>
          <label>覆盖标题（可选）
            <input id="book-title" type="text" placeholder="例如 深度觉醒">
          </label>
        </div>
        <div class="row">
          <label>封面图片链接（可选）
            <input id="book-cover-url" type="text" placeholder="https://...jpg/png">
          </label>
          <label>分类（可选）
            <input id="book-category" type="text" placeholder="例如 高中 / 科幻 / 心智成长">
          </label>
        </div>
        <label>章节闯关任务（可选，手动配置）</label>
        <textarea id="tasks-text" placeholder="推荐格式（不需要自己填中文）：&#10;### 1章单词表&#10;focus, logic, memory&#10;&#10;### 2章单词表&#10;purpose, feature, system&#10;&#10;也兼容旧格式：&#10;1|focus|专注"></textarea>
        <p class="hint">不配置就没有任务；只配置某几章，就只有这些章节有闯关任务。</p>
        <button class="btn" type="submit">上传并发布</button>
      </form>
    </div>

    <div class="card">
      <h2>发布日志</h2>
      <div id="log" class="log"></div>
    </div>

    <div class="card">
      <h2>当前书架（服务端）</h2>
      <button id="refresh-books" class="btn" type="button">刷新列表</button>
      <div class="book-batch-toolbar">
        <input id="confirm-admin-key" type="password" placeholder="删除确认：再次输入管理员密钥">
        <button id="select-all-books" type="button">全选</button>
        <button id="clear-selected-books" type="button">清空选择</button>
        <button id="batch-delete-books" class="danger" type="button">批量删除</button>
        <span id="selected-books-count" class="hint">已选 0 本</span>
      </div>
      <div id="book-list" style="margin-top:10px;"></div>
    </div>
  </div>

  <script>
    const KEY_STORAGE_KEY = "reader_admin_key_v1";
    const form = document.getElementById("upload-form");
    const logEl = document.getElementById("log");
    const bookList = document.getElementById("book-list");
    const refreshButton = document.getElementById("refresh-books");
    const adminKeyInput = document.getElementById("admin-key");
    const keyStatus = document.getElementById("key-status");
    const confirmAdminKeyInput = document.getElementById("confirm-admin-key");
    const selectAllBooksButton = document.getElementById("select-all-books");
    const clearSelectedBooksButton = document.getElementById("clear-selected-books");
    const batchDeleteBooksButton = document.getElementById("batch-delete-books");
    const selectedBooksCount = document.getElementById("selected-books-count");
    let currentBooks = [];
    const selectedBookIds = new Set();

    function log(message) {
      const time = new Date().toLocaleString();
      logEl.textContent = `[${time}] ${message}\n` + logEl.textContent;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function adminHeaders(overrideKey = "") {
      const key = String(overrideKey || adminKeyInput.value).trim();
      return key ? { "X-Admin-Key": key } : {};
    }

    function updateSelectedBooksCount() {
      selectedBooksCount.textContent = `已选 ${selectedBookIds.size} 本`;
    }

    async function verifyAdminKey(key) {
      const cleanKey = String(key || "").trim();
      if (!cleanKey) {
        throw new Error("请先输入删除确认密码");
      }
      const res = await fetch("/api/admin/verify", {
        method: "POST",
        headers: adminHeaders(cleanKey)
      });
      if (!res.ok) {
        throw new Error("确认密码错误");
      }
      adminKeyInput.value = cleanKey;
      localStorage.setItem(KEY_STORAGE_KEY, cleanKey);
      keyStatus.textContent = "管理员密钥校验成功。";
      return cleanKey;
    }

    async function prefillAdminKey() {
      const urlKey = new URLSearchParams(window.location.search).get("k");
      if (urlKey) {
        adminKeyInput.value = urlKey;
        localStorage.setItem(KEY_STORAGE_KEY, urlKey);
        keyStatus.textContent = "已从链接自动填入管理员密钥。";
        return;
      }

      const saved = localStorage.getItem(KEY_STORAGE_KEY);
      if (saved) {
        adminKeyInput.value = saved;
        keyStatus.textContent = "已使用上次成功的管理员密钥。";
      }

      try {
        const res = await fetch("/api/admin/bootstrap", { cache: "no-store" });
        if (!res.ok) {
          return;
        }
        const data = await res.json();
        if (data && data.adminKey) {
          adminKeyInput.value = String(data.adminKey);
          localStorage.setItem(KEY_STORAGE_KEY, String(data.adminKey));
          keyStatus.textContent = "本地服务已自动填入管理员密钥。";
        }
      } catch (_error) {
        // 忽略，手动输入即可
      }
    }

    async function refreshBooks() {
      bookList.innerHTML = "加载中...";
      try {
        const res = await fetch("/api/public/books", { cache: "no-store" });
        if (!res.ok) {
          throw new Error("获取书架失败");
        }
        const data = await res.json();
        const books = Array.isArray(data.books) ? data.books : [];
        currentBooks = books;
        const currentIdSet = new Set(books.map((book) => String(book.id)));
        [...selectedBookIds].forEach((bookId) => {
          if (!currentIdSet.has(bookId)) {
            selectedBookIds.delete(bookId);
          }
        });
        if (books.length === 0) {
          bookList.innerHTML = "<p class='hint'>当前还没有书。</p>";
          updateSelectedBooksCount();
          return;
        }
        bookList.innerHTML = books.map((book, index) => {
          const cover = String(book.coverUrl || "").trim();
          const checked = selectedBookIds.has(String(book.id)) ? "checked" : "";
          const coverNode = cover
            ? `<img class="book-cover" src="${escapeHtml(cover)}" alt="封面">`
            : `<div class="book-cover" style="display:flex;align-items:center;justify-content:center;color:#5d6c84;">无封面</div>`;
          return `
            <article class="book-item" data-book-id="${escapeHtml(book.id)}">
              <strong>${escapeHtml(book.title || "未命名")}</strong><br>
              <span class="hint">ID: ${escapeHtml(book.id)}</span><br>
              <span class="hint">章节数: ${(book.chapters || []).length} ｜ 排序: ${index + 1}</span>
              <div class="book-row">
                ${coverNode}
                <div class="book-meta">
                  <input data-field="title" type="text" value="${escapeHtml(book.title || "")}" placeholder="书名">
                  <input data-field="category" type="text" value="${escapeHtml(book.category || "")}" placeholder="分类">
                  <input data-field="coverUrl" type="text" value="${escapeHtml(book.coverUrl || "")}" placeholder="封面链接 https://...">
                </div>
              </div>
              <label class="pick-book"><input class="book-select" data-book-id="${escapeHtml(book.id)}" type="checkbox" ${checked}> 选中此书</label>
              <div class="book-toolbar">
                <button type="button" data-action="save">保存修改</button>
                <button type="button" data-action="up">上移</button>
                <button type="button" data-action="down">下移</button>
                <button type="button" class="danger" data-action="delete">删除</button>
              </div>
            </article>
          `;
        }).join("");
        updateSelectedBooksCount();
      } catch (error) {
        bookList.innerHTML = `<p class='hint'>${error.message}</p>`;
        updateSelectedBooksCount();
      }
    }

    refreshButton.addEventListener("click", refreshBooks);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = document.getElementById("book-file").files?.[0];
      if (!file) {
        log("请选择书籍文件");
        return;
      }
      const adminKey = document.getElementById("admin-key").value.trim();
      if (!adminKey) {
        log("请先输入管理员密钥");
        return;
      }
      const bookId = document.getElementById("book-id").value.trim();
      const bookTitle = document.getElementById("book-title").value.trim();
      const bookCoverUrl = document.getElementById("book-cover-url").value.trim();
      const bookCategory = document.getElementById("book-category").value.trim();
      const tasksText = document.getElementById("tasks-text").value;

      const formData = new FormData();
      formData.append("file", file);
      formData.append("tasks_text", tasksText);
      if (bookId) formData.append("book_id", bookId);
      if (bookTitle) formData.append("book_title", bookTitle);
      if (bookCoverUrl) formData.append("book_cover_url", bookCoverUrl);
      if (bookCategory) formData.append("book_category", bookCategory);

      try {
        const res = await fetch("/api/admin/books/upload", {
          method: "POST",
          headers: { "X-Admin-Key": adminKey },
          body: formData
        });
        const data = await res.json();
        if (!res.ok) {
          if (res.status === 401) {
            throw new Error("unauthorized（管理员密钥错误，或当前不是你的服务端地址）");
          }
          throw new Error(data.error || "上传失败");
        }
        localStorage.setItem(KEY_STORAGE_KEY, adminKey);
        keyStatus.textContent = "管理员密钥校验成功。";
        log(`发布成功：${data.book.title}（${data.book.id}），章节 ${data.book.chapter_count}`);
        refreshBooks();
      } catch (error) {
        log(`发布失败：${error.message}`);
      }
    });

    prefillAdminKey();
    refreshBooks();

    async function saveBook(bookId, payload) {
      const res = await fetch(`/api/admin/books/${encodeURIComponent(bookId)}`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          ...adminHeaders()
        },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || "保存失败");
      }
    }

    async function deleteBook(bookId, overrideKey = "") {
      const res = await fetch(`/api/admin/books/${encodeURIComponent(bookId)}`, {
        method: "DELETE",
        headers: adminHeaders(overrideKey)
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || "删除失败");
      }
    }

    async function reorderBooks(orderedIds) {
      const res = await fetch("/api/admin/books/reorder", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...adminHeaders()
        },
        body: JSON.stringify({ orderedIds })
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || "排序失败");
      }
    }

    async function getDeleteConfirmKey() {
      const key = confirmAdminKeyInput.value.trim();
      await verifyAdminKey(key);
      return key;
    }

    selectAllBooksButton.addEventListener("click", () => {
      currentBooks.forEach((book) => selectedBookIds.add(String(book.id)));
      bookList.querySelectorAll(".book-select").forEach((node) => {
        node.checked = true;
      });
      updateSelectedBooksCount();
    });

    clearSelectedBooksButton.addEventListener("click", () => {
      selectedBookIds.clear();
      bookList.querySelectorAll(".book-select").forEach((node) => {
        node.checked = false;
      });
      updateSelectedBooksCount();
    });

    batchDeleteBooksButton.addEventListener("click", async () => {
      const ids = [...selectedBookIds];
      if (ids.length === 0) {
        alert("请先勾选要删除的书");
        return;
      }
      if (!confirm(`确认批量删除 ${ids.length} 本书？删除后读者书架会同步消失。`)) {
        return;
      }
      try {
        const confirmKey = await getDeleteConfirmKey();
        let success = 0;
        const failed = [];
        for (const id of ids) {
          try {
            await deleteBook(id, confirmKey);
            selectedBookIds.delete(id);
            success += 1;
          } catch (error) {
            failed.push(`${id}(${error.message})`);
          }
        }
        log(`批量删除完成：成功 ${success} 本，失败 ${failed.length} 本`);
        if (failed.length) {
          log(`失败明细：${failed.join("；")}`);
        }
        refreshBooks();
      } catch (error) {
        log(`批量删除失败：${error.message}`);
      }
    });

    bookList.addEventListener("change", (event) => {
      const checkbox = event.target.closest(".book-select");
      if (!checkbox) return;
      const bookId = String(checkbox.dataset.bookId || "");
      if (!bookId) return;
      if (checkbox.checked) {
        selectedBookIds.add(bookId);
      } else {
        selectedBookIds.delete(bookId);
      }
      updateSelectedBooksCount();
    });

    bookList.addEventListener("click", async (event) => {
      const btn = event.target.closest("button[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      const item = btn.closest(".book-item");
      if (!item) return;
      const bookId = item.dataset.bookId;
      if (!bookId) return;

      try {
        if (action === "save") {
          const title = item.querySelector('input[data-field="title"]').value.trim();
          const category = item.querySelector('input[data-field="category"]').value.trim();
          const coverUrl = item.querySelector('input[data-field="coverUrl"]').value.trim();
          if (!title) {
            alert("书名不能为空");
            return;
          }
          await saveBook(bookId, { title, category, coverUrl });
          log(`保存成功：${title}`);
          refreshBooks();
          return;
        }

        if (action === "delete") {
          if (!confirm("确认删除这本书？删除后读者书架会同步消失。")) {
            return;
          }
          const confirmKey = await getDeleteConfirmKey();
          await deleteBook(bookId, confirmKey);
          selectedBookIds.delete(bookId);
          log(`删除成功：${bookId}`);
          refreshBooks();
          return;
        }

        if (action === "up" || action === "down") {
          const ids = currentBooks.map((book) => book.id);
          const index = ids.indexOf(bookId);
          if (index < 0) return;
          const target = action === "up" ? index - 1 : index + 1;
          if (target < 0 || target >= ids.length) return;
          [ids[index], ids[target]] = [ids[target], ids[index]];
          await reorderBooks(ids);
          log(`排序已更新：${bookId}`);
          refreshBooks();
        }
      } catch (error) {
        log(`${action}失败：${error.message}`);
      }
    });
  </script>
</body>
</html>
